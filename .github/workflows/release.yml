name: Release OQUAKE

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable semantic version (X.Y.Z)
        required: true
        type: string
      release_notes:
        description: Reviewed Markdown release notes
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate release identity
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          ! gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: Packaging/AppImage/docker
          platforms: linux/amd64
          tags: build-oquake
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha
      - name: Build integrated OQUAKE
        run: docker run --rm --privileged -e VERSION="${{ inputs.version }}" -v "$PWD:/usr/src/vkQuake" build-oquake /usr/src/vkQuake/Packaging/AppImage/run-in-docker.sh
      - name: Package and verify OASIS runtime
        run: |
          set -euo pipefail
          source_archive=$(find Packaging/AppImage -type f -name '*.tar.gz' -print -quit)
          test -n "$source_archive"
          mkdir package
          tar -xzf "$source_archive" -C package
          cp Quake/OGEngineClient.so package/
          find package -type f -name 'vkquake*' | grep -q .
          test -s package/OGEngineClient.so
          tar -czf "OQUAKE-Linux-x64-v${{ inputs.version }}.tar.gz" -C package .
      - name: Create OQUAKE release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RELEASE_NOTES" > release-notes.md
          gh release create "v$VERSION" "OQUAKE-Linux-x64-v$VERSION.tar.gz" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "OQUAKE v$VERSION" --notes-file release-notes.md --verify-tag=false
